schema_version: 1

context:
  name: pinecone
  version: "10.0.0"

package:
  name: pinecone
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pinecone/pinecone-${{ version }}.tar.gz
  sha256: 6066bbe9a7ae1d667cde08d262deb6fbea6feb35deb9177dd47141b55bbd9833

build:
  number: 0
  # we only build 1 package for each target platform
  python:
    version_independent: true

  script:
    env:
      CARGO_PROFILE_RELEASE_STRIP: symbols
      CARGO_PROFILE_RELEASE_LTO: fat
      PYTHONIOENCODING: utf-8
    content:
      - "${{ PYTHON }} -m pip install -vv --no-deps --no-build-isolation ."
      - cargo-bundle-licenses --format yaml --output THIRDPARTY.yml

requirements:
  build:
    - cargo-bundle-licenses
    - ${{ compiler('c') }}
    - ${{ stdlib('c') }}
    - ${{ compiler('rust') }}
    - maturin >=1.0,<2.0
    - libprotobuf
    - if: build_platform != target_platform
      then:
        - python ${{ python_min }}.*
        - cross-python_${{ target_platform }}
  host:
    - python ${{ python_min }}.*
    - pip
    - maturin >=1.0,<2.0
  run:
    - python >=${{ python_min }}
    - httpx >=0.27,<1.0
    # start httpx[http2]
    - h2 >=3,<5
    # end httpx[http2]
    - msgspec >=0.19,<0.22
    - orjson >=3.11,<4
    - anyio >=4.0

tests:
  - python:
      imports:
        - pinecone
      pip_check: true
      python_version: ${{ python_min }}.*

about:
  summary: Pinecone client and SDK
  license: Apache-2.0
  license_file:
    - LICENSE
    - THIRDPARTY.yml
  homepage: https://www.pinecone.io
  repository: https://github.com/pinecone-io/python-sdk
  documentation: https://docs.pinecone.io/guides/get-started/overview

extra:
  recipe-maintainers:
    - isuruf
    - xylar
